; CouchDB settings for Obsidian's Self-hosted LiveSync plugin, from the plugin's setup guide
; (https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md).
; Copied in and read at startup only: after editing, `docker compose restart couchdb`.
; The admin login is not here - the image writes it from COUCHDB_USER/COUCHDB_PASSWORD in .env.

[couchdb]
single_node = true
; vault files are stored as chunks; this allows large attachments (PDFs, images)
max_document_size = 50000000

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

; Obsidian desktop (app://obsidian.md), iOS/Android (capacitor://localhost, http://localhost)
[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
