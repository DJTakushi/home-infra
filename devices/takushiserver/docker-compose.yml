# Project name is the machine, so containers, networks and volumes read takushiserver_* on the
# host. Pinned here so the folder this file lives in doesn't decide it.
name: takushiserver

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Only the database login; set in .env, which the database service below reads too.
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
  pihole:
    #copied from https://docs.pi-hole.net/docker/
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "443:443/tcp"
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location from
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g:
      TZ: 'America/Chicago'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_listeningMode: 'all'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './etc-pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    shm_size: 1Gb
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      # - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      # - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: always

  forgejo:
    # Self-hosted Git with pull requests, issues and a GitHub-like web UI - a backup remote for
    # work repos that have no hosted home yet. See README "forgejo". Pi-hole holds host ports
    # 80/443 and Grafana 3000, so the web UI is on 3300 and Git-over-SSH on 2222.
    # 15 is the long-term-support line; move to the next LTS deliberately, not via :latest.
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:15
    environment:
      USER_UID: ${FORGEJO_UID:-1000}
      USER_GID: ${FORGEJO_GID:-1000}
      # How clone URLs are written - set FORGEJO_HOST in .env to the server's LAN name or IP.
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST:-localhost}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_HOST:-localhost}
      FORGEJO__server__ROOT_URL: http://${FORGEJO_HOST:-localhost}:3300/
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__database__DB_TYPE: sqlite3
      # Accounts are created by the admin (the first-run page creates the admin), not self-signup.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      # Repos, the SQLite database and config. Back this folder up (see README).
      - ${FORGEJO_DATA_LOCATION:-./forgejo}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3300:3000"
      - "2222:22"
    restart: always

  tailscale:
    # Private access to every service here from outside the home network, with no router port
    # forwards. Host networking makes this node the server itself, so each port published above
    # (Immich 2283, Forgejo 3300/2222, Pi-hole) is reachable over the tailnet. See README "tailscale".
    container_name: tailscale
    image: tailscale/tailscale:stable
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # One-time auth key from the admin console (Settings -> Keys), set in .env. Only used to
      # join; after that the login lives in the state folder.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      # Name on the tailnet (MagicDNS), so http://ts:3300 works away from home.
      TS_HOSTNAME: ${TS_HOSTNAME:-ts}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # HTTPS with a real certificate at https://ts.<tailnet>.ts.net for the services listed in
      # tailscale-serve/serve.json (tailnet only). Reapplied whenever the file changes.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      # Node identity and login. Keep it - deleting it makes the server join as a new machine.
      - ${TAILSCALE_DATA_LOCATION:-./tailscale}:/var/lib/tailscale
      # A folder, not the file: a single-file mount wouldn't see changes from git pull.
      - ./tailscale-serve:/config:ro
    restart: always

  homepage:
    # Front page for this server: a card per service with live status, and links to each one's
    # README section. Config is tracked in ./homepage. See README "homepage".
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.7.0
    environment:
      # Required: the exact host:port the page is opened at, comma-separated.
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-ts:3001,192.168.130.52:3001}
      PUID: ${HOMEPAGE_UID:-1000}
      PGID: ${HOMEPAGE_GID:-1000}
      # Read by homepage/*.yaml as {{HOMEPAGE_VAR_...}}.
      HOMEPAGE_VAR_HOST: ${HOMEPAGE_HOST:-ts}
      HOMEPAGE_VAR_IMMICH_KEY: ${HOMEPAGE_IMMICH_KEY:-}
      # Pi-hole v6 accepts its web password as the API key, so no separate key to create.
      HOMEPAGE_VAR_PIHOLE_KEY: ${PIHOLE_PASSWORD}
    volumes:
      - ./homepage:/app/config
    ports:
      - "3001:3000"
    restart: always

volumes:
  model-cache:
